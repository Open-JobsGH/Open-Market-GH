<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Market | Log In</title>
    <link rel="icon" type="image/x-icon" href="icons and images/Open Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-theme');
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --purple-main: #500e8c; --purple-hover: #6c21b8;
            --bg-light: #ffffff; --bg-search: #f1f2f6; --text-dark: #500e8c; --text-body: #1a1a1a;
            --text-muted: #8e8e93; --border-card: #f2f2f7; --card-sub-bg: #ffffff;
        }
        .dark-theme {
            --purple-main: #a370db; --purple-hover: #b689e6;
            --bg-light: #121212; --bg-search: #2a2a2a; --text-dark: #b689e6; --text-body: #f3f4f6;
            --text-muted: #9ca3af; --border-card: rgba(255,255,255,0.08); --card-sub-bg: #1e1e1e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        /* ---------- Custom purple scrollbars (site-wide) ---------- */
        * { scrollbar-width: thin; scrollbar-color: var(--purple-main) transparent; }
        *::-webkit-scrollbar { width: 6px; height: 6px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background-color: var(--purple-main); border-radius: 10px; }
        *::-webkit-scrollbar-thumb:hover { background-color: var(--purple-text-title, var(--purple-hover, var(--purple-main))); }
        body {
            background-color: var(--bg-light); color: var(--text-body); min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 24px 16px;
        }

        .auth-card {
            width: 100%; max-width: 400px; background: var(--card-sub-bg);
            border: 1px solid var(--border-card); border-radius: 20px;
            padding: 32px 26px; box-shadow: 0 12px 32px rgba(0,0,0,0.06);
        }

        .brand-header { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 6px; }
        .brand-header img { height: 34px; width: auto; object-fit: contain; }
        .subtitle { text-align: center; font-size: 12.5px; color: var(--text-muted); margin-bottom: 22px; }

        .info-banner {
            display: none; background: rgba(80,14,140,0.08); color: var(--purple-main);
            border: 1px solid var(--purple-main); border-radius: 10px; padding: 10px 14px;
            font-size: 12px; font-weight: 600; margin-bottom: 16px; text-align: center;
        }

        .field-group { margin-bottom: 12px; }
        .text-input {
            width: 100%; padding: 13px 14px; border: 1px solid var(--border-card); border-radius: 12px;
            font-size: 13.5px; background: var(--bg-search); color: var(--text-body); outline: none;
            font-family: inherit; transition: border-color 0.15s ease;
        }
        .text-input:focus { border-color: var(--purple-main); }
        .text-input.invalid { border-color: #e0293e; }

        .password-wrapper { position: relative; }
        .password-wrapper .text-input { padding-right: 42px; }
        .toggle-password {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .error-message { display: none; color: #e0293e; font-size: 12px; font-weight: 500; margin: 4px 2px 8px; }

        .primary-btn {
            width: 100%; background: var(--purple-main); color: #fff; border: none;
            padding: 13px; border-radius: 30px; font-size: 14px; font-weight: 700; cursor: pointer;
            margin-top: 6px; transition: background 0.15s ease; font-family: inherit;
        }
        .primary-btn:hover { background: var(--purple-hover); }

        .biometric-btn {
            display: none; width: 100%; align-items: center; justify-content: center; gap: 8px;
            background: transparent; color: var(--purple-main); border: 1.5px solid var(--purple-main);
            border-radius: 30px; padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
            margin-bottom: 14px; font-family: inherit;
        }
        .biometric-btn:active { transform: scale(0.98); }
        .biometric-error { display: none; color: #e0293e; font-size: 12px; font-weight: 500; margin-bottom: 10px; text-align: center; }

        .divider { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border-card); }
        .divider span { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

        .google-btn {
            display: flex; width: 100%; align-items: center; justify-content: center; gap: 10px;
            background: var(--card-sub-bg); color: var(--text-body); border: 1px solid var(--border-card);
            border-radius: 30px; padding: 12px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
            font-family: inherit;
        }
        .google-btn:hover { background: var(--bg-search); }
        .google-btn:active { transform: scale(0.98); }
        .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }

        .switch-text { text-align: center; font-size: 12.5px; color: var(--text-muted); margin-top: 20px; }
        .switch-text a { color: var(--purple-main); font-weight: 700; text-decoration: none; }
        .switch-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="auth-card">
    <form id="loginForm">
        <div class="brand-header">
            <img src="icons and images/Open Market Logo.png" alt="Open Market">
        </div>
        <p class="subtitle">Welcome back — sign in to continue shopping.</p>

        <div class="info-banner" id="newAccountBanner">✅ Account created — sign in to continue.</div>

        <button type="button" class="biometric-btn" id="biometricBtn">
            <i class="ph ph-fingerprint"></i> Sign in with Face ID / Fingerprint
        </button>
        <div class="biometric-error" id="biometricError">Biometric sign-in failed. Please use your password below.</div>

        <div class="field-group">
            <input id="email" class="text-input" type="text" name="email" placeholder="Email or Username" required>
        </div>
        <div class="field-group">
            <div class="password-wrapper">
                <input id="password" class="text-input" type="password" name="password" placeholder="Password" required>
                <button type="button" class="toggle-password" id="togglePassword"><i class="ph ph-eye"></i></button>
            </div>
            <div style="text-align:right;margin-top:6px;">
                <a href="forgot-password.html" id="forgotPasswordLink" style="font-size:12px;font-weight:600;color:var(--purple-main);text-decoration:none;">Forgot Password?</a>
            </div>
        </div>

        <div class="error-message" id="accountError">❌ Sorry, account does not exist</div>

        <button type="submit" class="primary-btn">Sign In</button>

        <div class="divider"><span>or</span></div>

        <button type="button" class="google-btn" id="googleLoginBtn">
            <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
            <span>Continue with Google</span>
        </button>

        <p class="switch-text">Don't have an account? <a href="signup.html" id="signupLink">Sign Up</a></p>
        <p class="switch-text" style="margin-top:10px;"><a href="home.html" style="color:var(--text-muted);font-weight:600;text-decoration:underline;">Continue without signing in</a></p>
    </form>
</div>

<script src="api.js?v=3"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    const returnTo = params.get('returnTo');
    if (returnTo) {
        document.getElementById('signupLink').href = `signup.html?returnTo=${encodeURIComponent(returnTo)}`;
        document.getElementById('forgotPasswordLink').href = `forgot-password.html?returnTo=${encodeURIComponent(returnTo)}`;
    }

    const form = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const accountError = document.getElementById('accountError');
    const biometricBtn = document.getElementById('biometricBtn');
    const biometricError = document.getElementById('biometricError');

    // If someone just created an account and got redirected here, greet them.
    if (params.get('newAccount') === '1') {
        document.getElementById('newAccountBanner').style.display = 'block';
    }

    // Password show/hide toggle
    document.getElementById('togglePassword').addEventListener('click', function() {
        const icon = this.querySelector('i');
        const showing = passwordInput.type === 'text';
        passwordInput.type = showing ? 'password' : 'text';
        icon.className = showing ? 'ph ph-eye' : 'ph ph-eye-slash';
    });

    // Offer biometric quick sign-in only when every condition is actually met.
    (async function setupBiometricButton() {
        const lastEmail = OpenAPI.getLastLoginEmail();
        if (!lastEmail) return;
        if (!OpenAPI.hasBiometricEnabled(lastEmail)) return;
        const available = await OpenAPI.isBiometricAvailableOnDevice();
        if (!available) return;
        biometricBtn.style.display = 'flex';
    })();

    biometricBtn.addEventListener('click', async function() {
        biometricError.style.display = 'none';
        const lastEmail = OpenAPI.getLastLoginEmail();
        const originalLabel = biometricBtn.innerHTML;
        biometricBtn.disabled = true;
        biometricBtn.innerHTML = 'Waiting for fingerprint / Face ID…';

        const result = await OpenAPI.loginWithBiometric(lastEmail);
        if (result.ok) {
            window.location.href = OpenAPI.getSafeReturnTo();
            return;
        }
        biometricBtn.disabled = false;
        biometricBtn.innerHTML = originalLabel;
        biometricError.style.display = 'block';
    });

    // -------- Google Sign-In --------
    // *** Requires your own Client ID from https://console.cloud.google.com/apis/credentials ***
    // Create an OAuth client ID (type "Web application"), add this site's exact
    // origin under "Authorized JavaScript origins", then paste the client ID below.
    // Google will not work at all from a file:// page — it needs a real http(s) origin.
    const GOOGLE_CLIENT_ID = "YOUR_CLIENT_ID_HERE.apps.googleusercontent.com";

    let googleTokenClient = null;
    const googleBtn = document.getElementById('googleLoginBtn');

    function initGoogleAuth() {
        if (!window.google || !google.accounts || !google.accounts.oauth2) {
            setTimeout(initGoogleAuth, 300);
            return;
        }
        googleTokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: 'openid email profile',
            callback: handleGoogleTokenResponse
        });
    }

    async function handleGoogleTokenResponse(tokenResponse) {
        if (!tokenResponse || tokenResponse.error) {
            await OpenAPI.showAlert("Google sign-in was cancelled or didn't complete. Please try again.", { title: "Couldn't sign in" });
            resetGoogleButton();
            return;
        }
        try {
            const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: `Bearer ${tokenResponse.access_token}` }
            });
            if (!res.ok) throw new Error('userinfo request failed');
            const profile = await res.json();
            OpenAPI.loginOrRegisterWithGoogle(profile);
            window.location.href = OpenAPI.getSafeReturnTo();
        } catch (err) {
            await OpenAPI.showAlert("Something went wrong finishing Google sign-in. Please try again.", { title: "Couldn't sign in" });
            resetGoogleButton();
        }
    }

    function resetGoogleButton() {
        googleBtn.disabled = false;
        googleBtn.querySelector('span').innerText = 'Continue with Google';
    }

    googleBtn.addEventListener('click', () => {
        if (!googleTokenClient) {
            initGoogleAuth();
            OpenAPI.showAlert("Still connecting to Google — please try again in a moment.", { title: 'One sec' });
            return;
        }
        googleBtn.disabled = true;
        googleBtn.querySelector('span').innerText = 'Connecting…';
        googleTokenClient.requestAccessToken();
        setTimeout(resetGoogleButton, 4000);
    });

    initGoogleAuth();

    // Clear errors while retyping
    passwordInput.addEventListener('input', function() {
        this.classList.remove('invalid');
        accountError.style.display = 'none';
    });
    emailInput.addEventListener('input', function() {
        passwordInput.classList.remove('invalid');
        accountError.style.display = 'none';
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const identifier = emailInput.value.trim();
        const password = passwordInput.value;

        accountError.style.display = 'none';
        passwordInput.classList.remove('invalid');

        const result = OpenAPI.validateLogin(identifier, password);

        if (!result.ok && result.reason === 'not_found') {
            accountError.innerText = '❌ Sorry, account does not exist';
            accountError.style.display = 'block';
            return;
        }
        if (!result.ok && result.reason === 'wrong_password') {
            accountError.innerText = '❌ Incorrect password';
            accountError.style.display = 'block';
            passwordInput.classList.add('invalid');
            passwordInput.focus();
            return;
        }
        if (!result.ok && result.reason === 'google_only') {
            accountError.innerText = '❌ This account uses Google Sign-In — use the button below';
            accountError.style.display = 'block';
            return;
        }

        window.location.href = OpenAPI.getSafeReturnTo();
    });
});
</script>
</body>
</html>
