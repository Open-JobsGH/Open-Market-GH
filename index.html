<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Open Market | Welcome</title>
  <link rel="icon" type="image/x-icon" href="icons and images/Open Favicon.png">
  <script src="api.js?v=3"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ---------- Custom purple scrollbars (site-wide) ---------- */
    * { scrollbar-width: thin; scrollbar-color: #500e8c transparent; }
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-track { background: transparent; }
    *::-webkit-scrollbar-thumb { background-color: #500e8c; border-radius: 10px; }
    *::-webkit-scrollbar-thumb:hover { background-color: #6c21b8; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #ffffff;
      min-height: 100vh;
      overflow: hidden;
    }

    .splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: #ffffff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1000;
      transition: opacity 0.8s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      opacity: 1;
    }
    .splash-screen.fade-out { opacity: 0; pointer-events: none; }

    .image-wrapper {
      flex: 1 0 auto; display: flex; align-items: center; justify-content: center;
      margin-top: 5vh; padding: 0 4vw; box-sizing: border-box; width: 100%;
    }

    .hero-image {
      width: 100%; max-width: min(480px, 78%); max-height: 40vh; height: auto;
      object-fit: contain;
    }

    .bottom-text {
      width: 100%; text-align: center; padding: 2rem 1.5rem 2.8rem;
    }

    .progress-timer {
      margin-top: 1.4rem; width: 120px; height: 3px;
      background-color: #f1f2f6; border-radius: 4px;
      margin-left: auto; margin-right: auto; overflow: hidden;
    }
    .progress-fill {
      width: 0%; height: 100%; background-color: #500e8c; border-radius: 4px;
      transition: width linear 0.05s;
    }

    @media (max-width: 550px) {
      .hero-image { max-width: 85%; max-height: 32vh; }
      .bottom-text { padding-bottom: 2rem; }
    }
  </style>
</head>
<body>
  <div id="splash" class="splash-screen">
    <div class="image-wrapper">
      <img class="hero-image"
           src="icons and images/Open Market Logo.png"
           alt="Open Market — Shop More. Spend Less."
           loading="eager">
    </div>
    <div class="bottom-text">
      <div class="progress-timer">
        <div id="progressFill" class="progress-fill"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const SPLASH_DURATION = 2800;

      const splashElement = document.getElementById('splash');
      const progressFill = document.getElementById('progressFill');

      let startTime = null;
      let animationFrameId = null;
      let redirectExecuted = false;

      function updateProgress(now) {
        if (!startTime) return;
        const elapsed = now - startTime;
        const percent = Math.min(1, elapsed / SPLASH_DURATION) * 100;
        if (progressFill) progressFill.style.width = percent + '%';
        if (elapsed < SPLASH_DURATION) {
          animationFrameId = requestAnimationFrame(updateProgress);
        } else if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }
      }

      function startProgressAnimation() {
        startTime = performance.now();
        if (progressFill) progressFill.style.width = '0%';
        animationFrameId = requestAnimationFrame(updateProgress);
      }

      function redirectNext() {
        if (redirectExecuted) return;
        redirectExecuted = true;

        // Home is open to everyone now — signed in or not. Login only kicks in
        // when a guest tries a gated action (add to cart, wishlist, account).
        const destination = 'home.html';

        splashElement.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = destination;
        }, 850);
      }

      startProgressAnimation();
      setTimeout(redirectNext, SPLASH_DURATION);
    })();
  </script>
</body>
</html>
