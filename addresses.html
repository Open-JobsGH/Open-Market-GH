<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Market | Delivery Addresses</title>
    <link rel="icon" type="image/x-icon" href="icons and images/Open Favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-theme');
    </script>
    <style>
        :root {
            --purple-main: #500e8c;
            --bg-light: #ffffff; --bg-search: #f1f2f6; --text-dark: #500e8c; --text-body: #1a1a1a;
            --text-muted: #8e8e93; --border-card: #f2f2f7; --card-sub-bg: #ffffff;
        }
        .dark-theme {
            --purple-main: #a370db;
            --bg-light: #121212; --bg-search: #2a2a2a; --text-dark: #b689e6; --text-body: #f3f4f6;
            --text-muted: #9ca3af; --border-card: rgba(255,255,255,0.08); --card-sub-bg: #1e1e1e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        /* ---------- Custom purple scrollbars (site-wide) ---------- */
        * { scrollbar-width: thin; scrollbar-color: var(--purple-main) transparent; }
        *::-webkit-scrollbar { width: 6px; height: 6px; }
        *::-webkit-scrollbar-track { background: transparent; }
        *::-webkit-scrollbar-thumb { background-color: var(--purple-main); border-radius: 10px; }
        *::-webkit-scrollbar-thumb:hover { background-color: var(--purple-hover, var(--purple-main)); }

        body { background-color: var(--bg-light); color: var(--text-body); min-height: 100vh; }
        .app-container { min-height: 100vh; max-width: 480px; margin: 0 auto; padding: 20px 20px 60px; }
        @media (min-width: 700px) {
            .app-container { max-width: 620px; padding: 28px 32px 70px; }
        }
        @media (min-width: 1000px) {
            .app-container { max-width: 760px; padding: 36px 40px 80px; }
        }
        @media (min-width: 1440px) {
            .app-container { max-width: 880px; padding: 44px 40px 90px; }
        }

        .header-row { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
        .back-btn { background: none; border: none; font-size: 20px; color: var(--purple-main); cursor: pointer; display: flex; }
        .header-row h1 { flex: 1; text-align: center; font-size: 16px; font-weight: 700; color: var(--text-dark); margin-right: 20px; }

        .empty-state { padding: 70px 20px; text-align: center; color: var(--text-muted); }
        .empty-state i { font-size: 48px; color: var(--border-card); margin-bottom: 12px; display: block; }
        .empty-state p { font-size: 14px; }
        .empty-state .sub { font-size: 12px; margin-top: 6px; }

        .add-address-btn {
            width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--card-sub-bg); border: 1.5px dashed var(--border-card); color: var(--purple-main);
            border-radius: 14px; padding: 16px; font-size: 13.5px; font-weight: 700; cursor: pointer;
            margin-top: 16px; font-family: inherit;
        }
        .add-address-btn:hover { border-color: var(--purple-main); background: var(--bg-search); }

        /* ---------- Address cards ---------- */
        .address-card {
            background: var(--card-sub-bg); border: 1px solid var(--border-card); border-radius: 16px;
            padding: 16px; margin-bottom: 12px; position: relative;
        }
        .address-card.is-default { border-color: var(--purple-main); }
        .address-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .address-label { font-size: 13.5px; font-weight: 700; color: var(--text-body); }
        .default-badge {
            font-size: 10px; font-weight: 700; color: #fff; background: var(--purple-main);
            padding: 2px 8px; border-radius: 20px; letter-spacing: 0.02em;
        }
        .address-name { font-size: 13px; color: var(--text-body); font-weight: 600; }
        .address-detail { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; margin-top: 2px; }
        .address-card-actions { display: flex; align-items: center; gap: 14px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-card); }
        .address-action-btn {
            display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
            color: var(--text-muted); background: none; border: none; cursor: pointer; font-family: inherit; padding: 0;
        }
        .address-action-btn:hover { color: var(--purple-main); }
        .address-action-btn.danger:hover { color: #e0293e; }
        .address-action-btn.set-default { color: var(--purple-main); margin-left: auto; }

        /* ---------- Add/Edit form ---------- */
        .hidden { display: none !important; }
        .form-title { font-size: 15px; font-weight: 800; color: var(--text-dark); margin-bottom: 16px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 12px; }
        .input-group label { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; font-weight: 500; }
        .input-group input, .input-group select, .input-group textarea {
            padding: 12px 14px; border: 1px solid var(--border-card); border-radius: 12px; font-size: 13.5px;
            outline: none; background-color: var(--bg-search); color: var(--text-body); font-family: inherit;
        }
        .input-group textarea { resize: vertical; min-height: 70px; }
        .input-group input:focus, .input-group select:focus, .input-group textarea:focus { border-color: var(--purple-main); }
        .input-row { display: flex; gap: 10px; }
        .input-row .input-group { flex: 1; }

        .label-chip-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .label-chip {
            flex: 1; text-align: center; padding: 10px; border-radius: 12px; border: 1px solid var(--border-card);
            font-size: 12.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; background: var(--card-sub-bg);
        }
        .label-chip.active { border-color: var(--purple-main); color: var(--purple-main); background: rgba(80,14,140,0.06); }

        .default-check-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 18px; font-size: 12.5px; color: var(--text-body);
        }
        .default-check-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--purple-main); cursor: pointer; }

        .form-actions { display: flex; gap: 10px; }
        .save-address-btn, .cancel-form-btn {
            flex: 1; border: none; padding: 13px; border-radius: 30px; font-size: 13.5px; font-weight: 700;
            cursor: pointer; font-family: inherit;
        }
        .save-address-btn { background: var(--purple-main); color: #fff; }
        .cancel-form-btn { background: var(--border-card); color: var(--text-muted); }

        .error-message { display: none; color: #e0293e; font-size: 11.5px; font-weight: 500; margin: -6px 0 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-row">
        <button class="back-btn" onclick="window.location.href='settings.html'"><i class="ph ph-caret-left"></i></button>
        <h1>Delivery Addresses</h1>
    </div>

    <!-- LIST VIEW -->
    <div id="list-view">
        <div id="address-list"></div>
        <button class="add-address-btn" id="add-address-btn"><i class="ph ph-plus-circle"></i> Add Delivery Address</button>
    </div>

    <!-- FORM VIEW (add or edit) -->
    <div id="form-view" class="hidden">
        <div class="form-title" id="form-title">Add Delivery Address</div>
        <form id="address-form">
            <div class="label-chip-row" id="label-chip-row">
                <div class="label-chip active" data-label="Home">Home</div>
                <div class="label-chip" data-label="Work">Work</div>
                <div class="label-chip" data-label="Other">Other</div>
            </div>
            <input type="hidden" id="input-label" value="Home">

            <div class="input-group">
                <label for="input-fullname">Full Name</label>
                <input type="text" id="input-fullname" required placeholder="Recipient's full name">
            </div>
            <div class="input-group">
                <label for="input-phone">Phone Number</label>
                <input type="tel" id="input-phone" required placeholder="e.g. 024 000 0000">
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label for="input-region">Region</label>
                    <select id="input-region" required></select>
                </div>
                <div class="input-group">
                    <label for="input-city">City / Town</label>
                    <input type="text" id="input-city" required placeholder="e.g. Accra">
                </div>
            </div>
            <div class="input-group">
                <label for="input-address-line">Street Address / Landmark</label>
                <textarea id="input-address-line" required placeholder="House number, street, closest landmark..."></textarea>
            </div>

            <div class="error-message" id="formError">Please fill in every field.</div>

            <label class="default-check-row">
                <input type="checkbox" id="input-is-default">
                <span>Set as default delivery address</span>
            </label>

            <div class="form-actions">
                <button type="button" class="cancel-form-btn" id="cancel-form-btn">Cancel</button>
                <button type="submit" class="save-address-btn">Save Address</button>
            </div>
        </form>
    </div>
</div>

<script src="api.js?v=3"></script>
<script>
    let editingAddressId = null;

    document.addEventListener('DOMContentLoaded', () => {
        if (!OpenAPI.getSession()) {
            window.location.href = `login.html?returnTo=${encodeURIComponent('addresses.html' + window.location.search)}`;
            return;
        }

        const regionSelect = document.getElementById('input-region');
        regionSelect.innerHTML = OpenAPI.GHANA_REGIONS.map(r => `<option value="${r}">${r}</option>`).join('');

        renderAddressList();
    });

    function renderAddressList() {
        const addresses = OpenAPI.getAddresses();
        const container = document.getElementById('address-list');

        if (addresses.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <i class="ph ph-map-pin"></i>
                    <p>No delivery addresses saved.</p>
                    <p class="sub">Add an address to speed up checkout.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = addresses.map(a => `
            <div class="address-card ${a.isDefault ? 'is-default' : ''}">
                <div class="address-card-top">
                    <span class="address-label">${escapeHtml(a.label)}</span>
                    ${a.isDefault ? '<span class="default-badge">Default</span>' : ''}
                </div>
                <div class="address-name">${escapeHtml(a.fullName)} · ${escapeHtml(a.phone)}</div>
                <div class="address-detail">${escapeHtml(a.addressLine)}<br>${escapeHtml(a.city)}, ${escapeHtml(a.region)}</div>
                <div class="address-card-actions">
                    <button class="address-action-btn" onclick="openEditForm('${a.addressId}')"><i class="ph ph-pencil-simple"></i> Edit</button>
                    <button class="address-action-btn danger" onclick="handleDeleteAddress('${a.addressId}')"><i class="ph ph-trash"></i> Delete</button>
                    ${!a.isDefault ? `<button class="address-action-btn set-default" onclick="handleSetDefault('${a.addressId}')">Set as Default</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function showListView() {
        document.getElementById('list-view').classList.remove('hidden');
        document.getElementById('form-view').classList.add('hidden');
    }

    function showFormView() {
        document.getElementById('list-view').classList.add('hidden');
        document.getElementById('form-view').classList.remove('hidden');
    }

    function selectLabelChip(label) {
        document.getElementById('input-label').value = label;
        document.querySelectorAll('.label-chip').forEach(chip => {
            chip.classList.toggle('active', chip.dataset.label === label);
        });
    }

    document.querySelectorAll('.label-chip').forEach(chip => {
        chip.addEventListener('click', () => selectLabelChip(chip.dataset.label));
    });

    function resetForm() {
        editingAddressId = null;
        document.getElementById('address-form').reset();
        selectLabelChip('Home');
        document.getElementById('input-is-default').checked = OpenAPI.getAddresses().length === 0;
        document.getElementById('formError').style.display = 'none';
        document.getElementById('form-title').innerText = 'Add Delivery Address';
    }

    document.getElementById('add-address-btn').addEventListener('click', () => {
        resetForm();
        showFormView();
    });

    document.getElementById('cancel-form-btn').addEventListener('click', () => {
        showListView();
    });

    function openEditForm(addressId) {
        const address = OpenAPI.getAddresses().find(a => a.addressId === addressId);
        if (!address) return;

        editingAddressId = addressId;
        document.getElementById('form-title').innerText = 'Edit Delivery Address';
        selectLabelChip(address.label);
        document.getElementById('input-fullname').value = address.fullName;
        document.getElementById('input-phone').value = address.phone;
        document.getElementById('input-region').value = address.region;
        document.getElementById('input-city').value = address.city;
        document.getElementById('input-address-line').value = address.addressLine;
        document.getElementById('input-is-default').checked = address.isDefault;
        document.getElementById('formError').style.display = 'none';
        showFormView();
    }

    async function handleDeleteAddress(addressId) {
        const confirmed = await OpenAPI.showConfirm('Remove this delivery address?', { title: 'Delete Address' });
        if (!confirmed) return;
        OpenAPI.deleteAddress(addressId);
        renderAddressList();
    }

    function handleSetDefault(addressId) {
        OpenAPI.setDefaultAddress(addressId);
        renderAddressList();
    }

    document.getElementById('address-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const data = {
            label: document.getElementById('input-label').value,
            fullName: document.getElementById('input-fullname').value.trim(),
            phone: document.getElementById('input-phone').value.trim(),
            region: document.getElementById('input-region').value,
            city: document.getElementById('input-city').value.trim(),
            addressLine: document.getElementById('input-address-line').value.trim(),
            isDefault: document.getElementById('input-is-default').checked,
        };

        if (!data.fullName || !data.phone || !data.region || !data.city || !data.addressLine) {
            document.getElementById('formError').style.display = 'block';
            return;
        }

        if (editingAddressId) {
            OpenAPI.updateAddress(editingAddressId, data);
        } else {
            OpenAPI.addAddress(data);
        }

        renderAddressList();
        showListView();

        // Came here from checkout (or anywhere) with a returnTo — head back now that
        // there's an address to use.
        const params = new URLSearchParams(window.location.search);
        const returnTo = params.get('returnTo');
        if (returnTo) window.location.href = OpenAPI.getSafeReturnTo();
    });
</script>
</body>
</html>
